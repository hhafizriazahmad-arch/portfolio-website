<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#111111"/>
  <defs>
    <radialGradient id="goldGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F4C542"/>
      <stop offset="100%" stop-color="#E6C200"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="150" r="350" fill="url(#goldGlow)"/>
  <circle cx="1050" cy="480" r="300" fill="url(#goldGlow)"/>
  
  <!-- Outer border -->
  <rect x="30" y="30" width="1140" height="570" rx="24" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Badge -->
  <rect x="80" y="80" width="360" height="44" rx="22" fill="#1E1E1E" stroke="#D4AF37" stroke-opacity="0.4"/>
  <circle cx="106" cy="102" r="6" fill="#D4AF37"/>
  <text x="126" y="108" fill="#D4AF37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="2">AI AUTOMATION &amp; DEV</text>
  
  <!-- Main Name Title -->
  <text x="80" y="220" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="800" letter-spacing="-1">Riaz Ahmad</text>
  <text x="80" y="295" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700">AI Automation Engineer &amp; Developer</text>
  
  <!-- Tagline / Description -->
  <text x="80" y="375" fill="#B0B0B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    <tspan x="80" dy="0">Building practical AI automation systems, lead-generation workflows,</tspan>
    <tspan x="80" dy="36">API integrations, and Python backend solutions for growing businesses.</tspan>
  </text>
  
  <!-- Capabilities Badges -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="220" height="42" rx="10" fill="#1E1E1E" stroke="#D4AF37" stroke-opacity="0.3"/>
    <text x="110" y="26" text-anchor="middle" fill="#D4AF37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Workflow Automation</text>
    
    <rect x="236" y="0" width="200" height="42" rx="10" fill="#1E1E1E" stroke="#D4AF37" stroke-opacity="0.3"/>
    <text x="336" y="26" text-anchor="middle" fill="#D4AF37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Python &amp; FastAPI</text>
    
    <rect x="452" y="0" width="220" height="42" rx="10" fill="#1E1E1E" stroke="#D4AF37" stroke-opacity="0.3"/>
    <text x="562" y="26" text-anchor="middle" fill="#D4AF37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Lead Intelligence</text>

    <rect x="688" y="0" width="200" height="42" rx="10" fill="#1E1E1E" stroke="#D4AF37" stroke-opacity="0.3"/>
    <text x="788" y="26" text-anchor="middle" fill="#D4AF37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">CRM Integration</text>
  </g>
</svg>
